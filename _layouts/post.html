---
layout: default
---

<article class="prose post-article">
  <a class="back-link" href="{{ '/' | relative_url }}">← Voltar ao início</a>
  <header>
    <p class="eyebrow">{{ page.categories | join: " · " }}</p>
    <h1>{{ page.title }}</h1>
    <p class="article-meta">Publicado em {{ page.date | date: "%d/%m/%Y" }}</p>
  </header>
  {{ content }}
</article>

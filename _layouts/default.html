<!doctype html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#385f75">
    <title>{% if page.title and page.title != 'Início' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=2">
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="{{ '/' | relative_url }}">Blog <span>Josiele Ferreira</span></a>
      <img class="profile-photo" src="{{ '/assets/images/perfil.png' | relative_url }}" alt="Retrato de Josiele Ferreira">

      <div class="profile-copy">
        <p class="eyebrow">Engenheira de Dados</p>
        <p>Dados confiáveis, arquiteturas escaláveis e inteligência aplicada ao negócio.</p>
      </div>

      <div class="social-links" aria-label="Redes sociais">
        <a href="{{ site.author.github }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7A11.3 11.3 0 0 0 8.4 22.8c.6.1.8-.3.8-.6v-2.1c-3.4.7-4.1-1.4-4.1-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6a4.7 4.7 0 0 1 1.2-3.2c-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.9.1 3.2a4.7 4.7 0 0 1 1.2 3.2c0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.2c0 .4.2.7.8.6A11.3 11.3 0 0 0 12 .7Z"/></svg>
        </a>
        <a href="{{ site.author.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.1 7.8H1.6V22h3.5V7.8ZM3.3 2A2.1 2.1 0 1 0 3.3 6.2 2.1 2.1 0 0 0 3.3 2ZM22.4 13.9c0-4.3-2.3-6.3-5.4-6.3a4.7 4.7 0 0 0-4.2 2.3V7.8H9.3V22h3.5v-7c0-1.9.4-3.7 2.7-3.7s2.4 2.1 2.4 3.8V22h3.5l1-8.1Z"/></svg>
        </a>
        <a href="{{ site.author.medium }}" target="_blank" rel="noopener noreferrer" aria-label="Medium" title="Medium">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5.2a.7.7 0 0 0-.2-.6L.3 2.8V2.5h6.1l4.7 10.4 4.1-10.4H21v.3l-1.3 1.3a.4.4 0 0 0-.2.4v14.8a.4.4 0 0 0 .2.4l1.3 1.2v.3h-6.6v-.3l1.3-1.3c.1-.1.1-.2.1-.4V7.3l-5.3 13.8H10L3.9 7.3v10.1c0 .5.1 1 .4 1.4l1.7 2v.3H1.2v-.3l1.7-2c.3-.4.4-.9.4-1.4V5.2H2Z"/></svg>
        </a>
      </div>

      <a class="button button-light" href="{{ site.author.linkedin }}" target="_blank" rel="noopener noreferrer">Vamos conversar</a>
    </aside>

    <main class="site-content">
      <header class="topbar">
        <nav class="top-navigation" aria-label="Navegação principal">
          <a href="{{ '/' | relative_url }}">Início</a>
          <a href="{{ '/#artigos' | relative_url }}">Artigos</a>
          <a href="{{ '/sobre/' | relative_url }}">Sobre mim</a>
        </nav>
      </header>
      {{ content }}
      <footer>
        <p>© {{ 'now' | date: '%Y' }} Josiele Ferreira · Construído com GitHub Pages.</p>
      </footer>
    </main>
  </body>
</html>
